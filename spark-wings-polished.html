<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TBEF Spark Wings — belt-loop ribbons</title>
<style>
  :root { --bg:#05070f; --ink:#e8ecf8; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif;
    gap:1.25rem; padding:2rem 1.25rem;
  }
  h1 { font-size:.95rem; font-weight:600; margin:0; opacity:.9; letter-spacing:.02em; text-align:center; }
  .row { display:flex; flex-wrap:wrap; gap:2rem; justify-content:center; align-items:start; }
  .col { display:grid; gap:.7rem; justify-items:center; }
  .stage {
    width:min(480px,94vw); aspect-ratio:16/9;
    border-radius:18px; overflow:hidden;
    background:#000; box-shadow:0 24px 70px rgba(0,0,0,.55);
    position:relative;
  }
  .stage .base { width:100%; height:100%; display:block; object-fit:cover; position:absolute; inset:0; }
  .stage svg.ribbons {
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; mix-blend-mode:screen;
  }
  .label { font-size:.85rem; opacity:.7; margin:0; }
  .note { max-width:44rem; text-align:center; font-size:.8rem; opacity:.55; line-height:1.45; margin:0; }
  @media (prefers-reduced-motion: reduce) {
    .ribbons .belt { animation: none !important; stroke-dashoffset: 0 !important; }
  }
</style>
</head>
<body>
  <h1>The Butterfly Effect Foundation — belt-loop ribbons</h1>
  <div class="row">
    <div class="col">
      <div class="stage" aria-label="Still logo">
        <img class="base" src="spark-wings-polished-still.png" alt="Spark Wings still"/>
      </div>
      <p class="label">Still</p>
    </div>
    <div class="col">
      <div class="stage" aria-label="Belt-loop animated ribbons">
        <img class="base" src="spark-wings-polished-still.png" alt="Spark Wings base"/>
        <svg class="ribbons" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="gL" x1="0" y1="1" x2="0.15" y2="0">
              <stop offset="0%" stop-color="#0E7458" stop-opacity="0"/>
              <stop offset="40%" stop-color="#3FCCA0" stop-opacity="1"/>
              <stop offset="100%" stop-color="#9dffd8" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="gR" x1="1" y1="1" x2="0.85" y2="0">
              <stop offset="0%" stop-color="#5B3FC4" stop-opacity="0"/>
              <stop offset="40%" stop-color="#A48BF2" stop-opacity="1"/>
              <stop offset="100%" stop-color="#e0d4ff" stop-opacity="0"/>
            </linearGradient>
            <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="3.2" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <radialGradient id="spark" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fff6c8" stop-opacity=".65"/>
              <stop offset="55%" stop-color="#ffd36a" stop-opacity=".2"/>
              <stop offset="100%" stop-color="#ffd36a" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <!-- Fixed ribbon shapes; dashoffset = drive belt travel -->
          <g filter="url(#glow)" fill="none" stroke-linecap="round">
            <path class="belt" d="M640 455 C 560 400, 470 290, 420 150" stroke="url(#gL)" stroke-width="13" opacity=".8"
              stroke-dasharray="42 28" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="2.8s" repeatCount="indefinite"/>
            </path>
            <path class="belt" d="M640 455 C 575 385, 505 255, 480 130" stroke="url(#gL)" stroke-width="8" opacity=".65"
              stroke-dasharray="30 22" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3.4s" repeatCount="indefinite"/>
            </path>
            <path class="belt" d="M640 455 C 545 415, 455 320, 395 200" stroke="url(#gL)" stroke-width="6" opacity=".5"
              stroke-dasharray="24 20" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="4s" repeatCount="indefinite"/>
            </path>
            <path class="belt" d="M640 455 C 590 370, 540 230, 520 110" stroke="url(#gL)" stroke-width="4" opacity=".4"
              stroke-dasharray="18 16" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3.1s" repeatCount="indefinite"/>
            </path>

            <path class="belt" d="M640 455 C 720 400, 810 290, 860 150" stroke="url(#gR)" stroke-width="13" opacity=".8"
              stroke-dasharray="42 28" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="2.9s" repeatCount="indefinite"/>
            </path>
            <path class="belt" d="M640 455 C 705 385, 775 255, 800 130" stroke="url(#gR)" stroke-width="8" opacity=".65"
              stroke-dasharray="30 22" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3.5s" repeatCount="indefinite"/>
            </path>
            <path class="belt" d="M640 455 C 735 415, 825 320, 885 200" stroke="url(#gR)" stroke-width="6" opacity=".5"
              stroke-dasharray="24 20" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="4.1s" repeatCount="indefinite"/>
            </path>
            <path class="belt" d="M640 455 C 690 370, 740 230, 760 110" stroke="url(#gR)" stroke-width="4" opacity=".4"
              stroke-dasharray="18 16" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3.2s" repeatCount="indefinite"/>
            </path>
          </g>
          <ellipse cx="640" cy="455" rx="68" ry="50" fill="url(#spark)">
            <animate attributeName="opacity" values=".4;.8;.4" dur="2.6s" repeatCount="indefinite"/>
          </ellipse>
        </svg>
      </div>
      <p class="label">Animated — belt loop (shape fixed)</p>
    </div>
  </div>
  <p class="note">Mark locked. Light travels along fixed ribbon curves like a drive belt. Hard-refresh after deploy (Cmd-Shift-R).</p>
</body>
</html>
