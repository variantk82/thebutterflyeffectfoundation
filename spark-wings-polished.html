
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TBEF Spark Wings — polished animated</title>
<style>
  :root { --bg:#05070f; --ink:#e8ecf8; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif;
    gap:1.25rem; padding:2rem 1.25rem;
  }
  h1 { font-size:.95rem; font-weight:600; margin:0; opacity:.9; letter-spacing:.02em; text-align:center; }
  .row { display:flex; flex-wrap:wrap; gap:2rem; justify-content:center; align-items:start; }
  .col { display:grid; gap:.7rem; justify-items:center; }
  .stage {
    width:min(480px,94vw); aspect-ratio:16/9;
    border-radius:18px; overflow:hidden;
    background:#000; box-shadow:0 24px 70px rgba(0,0,0,.55);
    position:relative;
  }
  .stage img, .stage canvas { width:100%; height:100%; display:block; object-fit:cover; }
  .label { font-size:.85rem; opacity:.7; margin:0; }
  .note { max-width:42rem; text-align:center; font-size:.8rem; opacity:.55; line-height:1.45; margin:0; }
  @media (prefers-reduced-motion: reduce) {
    #aurora { display:none !important; }
    #auroraStillFallback { display:block !important; }
  }
  #auroraStillFallback { display:none; width:100%; height:100%; object-fit:cover; }
  .spark {
    position:absolute; left:50%; top:63%; width:22%; height:28%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,246,200,.55) 0%, rgba(255,211,106,.18) 45%, transparent 70%);
    pointer-events:none; mix-blend-mode:screen;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:.45; transform:translate(-50%,-50%) scale(.92); }
    50% { opacity:.95; transform:translate(-50%,-50%) scale(1.12); }
  }
  @media (prefers-reduced-motion: reduce) { .spark { animation:none; opacity:.6; } }
</style>
</head>
<body>
  <h1>The Butterfly Effect Foundation — Spark Wings (your mark)</h1>
  <div class="row">
    <div class="col">
      <div class="stage" aria-label="Still logo">
        <img src="spark-wings-polished-still.png" alt="Spark Wings still"/>
      </div>
      <p class="label">Still</p>
    </div>
    <div class="col">
      <div class="stage" aria-label="Animated aurora logo">
        <img id="auroraStillFallback" src="spark-wings-polished-still.png" alt="Spark Wings still fallback"/>
        <canvas id="aurora" width="1280" height="720" aria-label="Animated Spark Wings"></canvas>
        <div class="spark" aria-hidden="true"></div>
      </div>
      <p class="label">Animated — aurora flow</p>
    </div>
  </div>
  <p class="note">Your mark, live: green / violet trails drift like northern lights from the spark. Hard-refresh if you still see the old page (Cmd-Shift-R).</p>
<script>
(function () {
  const canvas = document.getElementById('aurora');
  if (!canvas) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.src = 'spark-wings-polished-still.png';

  let w = 1280, h = 720, ready = false, t0 = performance.now();

  function prep() {
    w = img.naturalWidth || 1280;
    h = img.naturalHeight || 720;
    canvas.width = w;
    canvas.height = h;
    ready = true;
    requestAnimationFrame(tick);
  }

  function tick(now) {
    if (!ready) return;
    const t = (now - t0) / 1000;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    // Row-slice aurora curtain — clearly visible horizontal drift
    for (let y = 0; y < h; y++) {
      const yn = y / h;
      const wingBand = Math.sin(Math.PI * Math.min(1, Math.max(0, (yn - 0.1) / 0.62)));
      const amp = (14 + 26 * wingBand);
      const phase = t * 1.6 + yn * 7.2;
      const shift = Math.sin(phase) * amp + Math.sin(phase * 0.47 + 1.3) * amp * 0.55;
      // draw 1px source row shifted
      ctx.drawImage(img, 0, y, w, 1, shift, y, w, 1);
    }

    // soft color wash alternating L/R
    const wash = 0.12 + 0.1 * Math.sin(t * 1.2);
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = 'rgba(63,204,160,' + (wash * 0.55) + ')';
    ctx.fillRect(0, h * 0.12, w * 0.5, h * 0.55);
    ctx.fillStyle = 'rgba(164,139,242,' + (wash * 0.55) + ')';
    ctx.fillRect(w * 0.5, h * 0.12, w * 0.5, h * 0.55);
    ctx.restore();

    requestAnimationFrame(tick);
  }

  img.onload = prep;
  img.onerror = function () {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '16px system-ui';
    ctx.fillText('Missing spark-wings-polished-still.png', 24, 40);
  };
  if (img.complete && img.naturalWidth) prep();
})();
</script>
</body>
</html>
