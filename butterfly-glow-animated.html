<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TBEF — Glow butterfly (animated sparks)</title>
<style>
  :root { --bg:#05070f; --ink:#e8ecf8; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:
      radial-gradient(ellipse 70% 50% at 50% 45%, #121a33 0%, var(--bg) 70%);
    color:var(--ink); font-family:system-ui,sans-serif;
    gap:1.25rem; padding:2rem 1.25rem;
  }
  h1 { font-size:.95rem; font-weight:600; margin:0; opacity:.9; text-align:center; }
  .stage {
    width:min(720px,94vw); aspect-ratio:16/9;
    border-radius:20px; position:relative; overflow:hidden;
    background: transparent;
  }
  canvas { width:100%; height:100%; display:block; }
  .note { max-width:40rem; text-align:center; font-size:.8rem; opacity:.55; line-height:1.45; margin:0; }
  @media (prefers-reduced-motion: reduce) {
    /* still frame only via JS */
  }
</style>
</head>
<body>
  <h1>Glow butterfly — sparks drift &amp; pulse</h1>
  <div class="stage"><canvas id="c" width="1361" height="736" aria-label="Animated butterfly"></canvas></div>
  <p class="note">Background removed. Gold + cyan wing lights travel along the veins and breathe brighter / dimmer. Hard-refresh if cached.</p>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: true });
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = 'butterfly-glow-nobg.png';

  let w, h, base, sparks, ready = false, t0 = performance.now();

  function splitLayers(image) {
    w = image.naturalWidth; h = image.naturalHeight;
    canvas.width = w; canvas.height = h;
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const o = off.getContext('2d', { willReadFrequently: true });
    o.drawImage(image, 0, 0);
    const data = o.getImageData(0, 0, w, h);
    const d = data.data;

    const baseC = document.createElement('canvas');
    baseC.width = w; baseC.height = h;
    const sparksC = document.createElement('canvas');
    sparksC.width = w; sparksC.height = h;
    const bctx = baseC.getContext('2d');
    const sctx = sparksC.getContext('2d');
    const baseImg = bctx.createImageData(w, h);
    const sparkImg = sctx.createImageData(w, h);
    const bd = baseImg.data, sd = sparkImg.data;

    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i+1], b = d[i+2], a = d[i+3];
      if (a < 8) continue;
      const maxc = Math.max(r, g, b);
      const minc = Math.min(r, g, b);
      const chroma = maxc - minc;
      const lum = 0.2126*r + 0.7152*g + 0.0722*b;
      // gold sparks: high R+G, cyan: high G+B relative
      const isGold = (r > 140 && g > 100 && r >= b + 20 && chroma > 35 && lum > 70);
      const isCyan = (b > 110 && g > 90 && b >= r + 15 && chroma > 30 && lum > 55);
      if (isGold || isCyan) {
        sd[i] = r; sd[i+1] = g; sd[i+2] = b; sd[i+3] = a;
        // leave a dimmer echo on base so shape holds
        bd[i] = r * 0.35; bd[i+1] = g * 0.35; bd[i+2] = b * 0.35; bd[i+3] = a * 0.55;
      } else {
        bd[i] = r; bd[i+1] = g; bd[i+2] = b; bd[i+3] = a;
      }
    }
    bctx.putImageData(baseImg, 0, 0);
    sctx.putImageData(sparkImg, 0, 0);
    return { base: baseC, sparks: sparksC };
  }

  function tick(now) {
    if (!ready) return;
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, w, h);

    // body / veins (still)
    ctx.drawImage(base, 0, 0);

    if (reduce) {
      ctx.globalAlpha = 0.95;
      ctx.drawImage(sparks, 0, 0);
      ctx.globalAlpha = 1;
      return;
    }

    // breathe brightness
    const pulse = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * 2.1));
    // subtle drift along wing axes (outward from body)
    const driftX = Math.sin(t * 1.15) * 4.5;
    const driftY = Math.cos(t * 0.9) * 2.5;

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.35 + 0.55 * pulse;
    ctx.filter = 'brightness(' + (0.85 + 0.55 * pulse) + ') saturate(' + (1 + 0.35 * pulse) + ')';
    // layered copies with slight offsets = moving sparkle
    ctx.drawImage(sparks, driftX, driftY);
    ctx.globalAlpha = 0.25 + 0.35 * (1 - pulse);
    ctx.drawImage(sparks, -driftX * 0.7, driftY * 0.5);
    ctx.globalAlpha = 0.2 + 0.3 * pulse;
    ctx.drawImage(sparks, driftX * 0.4, -driftY);
    ctx.restore();

    // soft gold/cyan bloom pulse at center
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const bloom = 0.12 + 0.18 * pulse;
    const g = ctx.createRadialGradient(w*0.5, h*0.55, 10, w*0.5, h*0.55, w*0.28);
    g.addColorStop(0, 'rgba(255,210,120,' + bloom + ')');
    g.addColorStop(0.45, 'rgba(80,200,220,' + (bloom * 0.45) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();

    requestAnimationFrame(tick);
  }

  img.onload = function () {
    const layers = splitLayers(img);
    base = layers.base; sparks = layers.sparks;
    ready = true;
    requestAnimationFrame(tick);
  };
  img.onerror = function () {
    ctx.fillStyle = '#fff';
    ctx.font = '16px system-ui';
    ctx.fillText('Missing butterfly-glow-nobg.png', 24, 40);
  };
  if (img.complete && img.naturalWidth) img.onload();
})();
</script>
</body>
</html>
