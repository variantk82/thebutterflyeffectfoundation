<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TBEF — Butterfly ribbon wings (belt loop)</title>
<style>
  :root { --bg:#05070f; --navy:#101B3A; --ink:#e8ecf8; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif;
    gap:1.25rem; padding:2rem 1.25rem;
  }
  h1 { font-size:.95rem; font-weight:600; margin:0; opacity:.9; text-align:center; }
  .row { display:flex; flex-wrap:wrap; gap:2rem; justify-content:center; }
  .col { display:grid; gap:.7rem; justify-items:center; }
  .stage {
    width:min(340px,86vw); aspect-ratio:1;
    border-radius:28%;
    background: radial-gradient(120% 90% at 50% 18%, #1a274d 0%, var(--navy) 55%, #070b18 100%);
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 28px 70px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.12);
    position:relative; overflow:hidden;
  }
  .stage::before {
    content:""; position:absolute; inset:0; z-index:2;
    background:linear-gradient(180deg, rgba(255,255,255,.1), transparent 40%);
    pointer-events:none;
  }
  svg { width:100%; height:100%; display:block; position:relative; z-index:1; }
  .label { font-size:.85rem; opacity:.7; margin:0; }
  .note { max-width:40rem; text-align:center; font-size:.8rem; opacity:.55; line-height:1.45; margin:0; }
  @media (prefers-reduced-motion:reduce) {
    .belt { animation:none !important; }
  }
</style>
</head>
<body>
  <h1>Butterfly ribbons — belt-loop motion</h1>
  <div class="row">
    <div class="col">
      <div class="stage" aria-label="Still">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sparkS" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fffef5"/><stop offset="40%" stop-color="#ffe9a8"/>
              <stop offset="100%" stop-color="#ffd36a" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="gLS" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#0E7458"/><stop offset="100%" stop-color="#3FCCA0"/>
            </linearGradient>
            <linearGradient id="gRS" x1="1" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#5B3FC4"/><stop offset="100%" stop-color="#A48BF2"/>
            </linearGradient>
            <filter id="glS" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="1.4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <g filter="url(#glS)" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M100 118 C 78 108, 48 88, 38 58 C 32 42, 42 36, 55 42 C 68 48, 82 70, 100 118" stroke="url(#gLS)" stroke-width="2.2" opacity=".95"/>
            <path d="M100 118 C 74 104, 52 82, 44 55 C 40 44, 48 40, 58 45 C 70 52, 84 74, 100 118" stroke="url(#gLS)" stroke-width="1.5" opacity=".7"/>
            <path d="M100 118 C 82 128, 58 142, 48 158 C 42 168, 52 172, 62 164 C 74 154, 88 132, 100 118" stroke="url(#gLS)" stroke-width="1.9" opacity=".85"/>
            <path d="M100 118 C 122 108, 152 88, 162 58 C 168 42, 158 36, 145 42 C 132 48, 118 70, 100 118" stroke="url(#gRS)" stroke-width="2.2" opacity=".95"/>
            <path d="M100 118 C 126 104, 148 82, 156 55 C 160 44, 152 40, 142 45 C 130 52, 116 74, 100 118" stroke="url(#gRS)" stroke-width="1.5" opacity=".7"/>
            <path d="M100 118 C 118 128, 142 142, 152 158 C 158 168, 148 172, 138 164 C 126 154, 112 132, 100 118" stroke="url(#gRS)" stroke-width="1.9" opacity=".85"/>
          </g>
          <circle cx="100" cy="118" r="10" fill="url(#sparkS)"/><circle cx="100" cy="118" r="3" fill="#fff"/>
        </svg>
      </div>
      <p class="label">Still</p>
    </div>
    <div class="col">
      <div class="stage" aria-label="Belt-loop animated">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sparkA" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fffef5"/><stop offset="40%" stop-color="#ffe9a8"/>
              <stop offset="100%" stop-color="#ffd36a" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="gLA" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#0E7458"/><stop offset="100%" stop-color="#3FCCA0"/>
            </linearGradient>
            <linearGradient id="gRA" x1="1" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#5B3FC4"/><stop offset="100%" stop-color="#A48BF2"/>
            </linearGradient>
            <filter id="glA" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="1.5" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- Dim fixed silhouette so the wing shape always reads -->
          <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".35">
            <path d="M100 118 C 78 108, 48 88, 38 58 C 32 42, 42 36, 55 42 C 68 48, 82 70, 100 118" stroke="url(#gLA)" stroke-width="2.2"/>
            <path d="M100 118 C 74 104, 52 82, 44 55 C 40 44, 48 40, 58 45 C 70 52, 84 74, 100 118" stroke="url(#gLA)" stroke-width="1.5"/>
            <path d="M100 118 C 82 128, 58 142, 48 158 C 42 168, 52 172, 62 164 C 74 154, 88 132, 100 118" stroke="url(#gLA)" stroke-width="1.9"/>
            <path d="M100 118 C 122 108, 152 88, 162 58 C 168 42, 158 36, 145 42 C 132 48, 118 70, 100 118" stroke="url(#gRA)" stroke-width="2.2"/>
            <path d="M100 118 C 126 104, 148 82, 156 55 C 160 44, 152 40, 142 45 C 130 52, 116 74, 100 118" stroke="url(#gRA)" stroke-width="1.5"/>
            <path d="M100 118 C 118 128, 142 142, 152 158 C 158 168, 148 172, 138 164 C 126 154, 112 132, 100 118" stroke="url(#gRA)" stroke-width="1.9"/>
          </g>
          <!-- Bright belt segments racing along the SAME fixed paths -->
          <g filter="url(#glA)" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path class="belt" d="M100 118 C 78 108, 48 88, 38 58 C 32 42, 42 36, 55 42 C 68 48, 82 70, 100 118"
              stroke="url(#gLA)" stroke-width="2.4" opacity=".95" stroke-dasharray="18 14" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="2.6s" repeatCount="indefinite"/>
            </path>
            <path class="belt" d="M100 118 C 74 104, 52 82, 44 55 C 40 44, 48 40, 58 45 C 70 52, 84 74, 100 118"
              stroke="url(#gLA)" stroke-width="1.6" opacity=".75" stroke-dasharray="14 12" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3.2s" repeatCount="indefinite"/>
            </path>
            <path class="belt" d="M100 118 C 82 128, 58 142, 48 158 C 42 168, 52 172, 62 164 C 74 154, 88 132, 100 118"
              stroke="url(#gLA)" stroke-width="2" opacity=".85" stroke-dasharray="16 13" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="2.9s" repeatCount="indefinite"/>
            </path>
            <path class="belt" d="M100 118 C 122 108, 152 88, 162 58 C 168 42, 158 36, 145 42 C 132 48, 118 70, 100 118"
              stroke="url(#gRA)" stroke-width="2.4" opacity=".95" stroke-dasharray="18 14" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="2.7s" repeatCount="indefinite"/>
            </path>
            <path class="belt" d="M100 118 C 126 104, 148 82, 156 55 C 160 44, 152 40, 142 45 C 130 52, 116 74, 100 118"
              stroke="url(#gRA)" stroke-width="1.6" opacity=".75" stroke-dasharray="14 12" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3.3s" repeatCount="indefinite"/>
            </path>
            <path class="belt" d="M100 118 C 118 128, 142 142, 152 158 C 158 168, 148 172, 138 164 C 126 154, 112 132, 100 118"
              stroke="url(#gRA)" stroke-width="2" opacity=".85" stroke-dasharray="16 13" pathLength="100">
              <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3s" repeatCount="indefinite"/>
            </path>
          </g>
          <circle cx="100" cy="118" r="11" fill="url(#sparkA)">
            <animate attributeName="r" values="9;12;9" dur="2.6s" repeatCount="indefinite"/>
          </circle>
          <circle cx="100" cy="118" r="3" fill="#fff"/>
        </svg>
      </div>
      <p class="label">Animated — belt loop</p>
    </div>
  </div>
  <p class="note">Wing shape fixed. Color segments travel the loop like a drive belt. Hard-refresh (Cmd-Shift-R).</p>
</body>
</html>
