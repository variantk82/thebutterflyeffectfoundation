<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TBEF — Butterfly ribbon wings</title>
<style>
  :root { --bg:#05070f; --navy:#101B3A; --ink:#e8ecf8; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif;
    gap:1.25rem; padding:2rem 1.25rem;
  }
  h1 { font-size:.95rem; font-weight:600; margin:0; opacity:.9; text-align:center; }
  .row { display:flex; flex-wrap:wrap; gap:2rem; justify-content:center; }
  .col { display:grid; gap:.7rem; justify-items:center; }
  .stage {
    width:min(340px,86vw); aspect-ratio:1;
    border-radius:28%;
    background: radial-gradient(120% 90% at 50% 18%, #1a274d 0%, var(--navy) 55%, #070b18 100%);
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 28px 70px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.12);
    position:relative; overflow:hidden;
  }
  .stage::before {
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,.1), transparent 40%);
    pointer-events:none; z-index:2;
  }
  svg { width:100%; height:100%; display:block; position:relative; z-index:1; }
  .label { font-size:.85rem; opacity:.7; margin:0; }
  .note { max-width:40rem; text-align:center; font-size:.8rem; opacity:.55; line-height:1.45; margin:0; }
  @media (prefers-reduced-motion:reduce) {
    .anim animate { display:none; }
  }
</style>
</head>
<body>
  <h1>Concept — color ribbons as butterfly wings</h1>
  <div class="row">
    <div class="col">
      <div class="stage" aria-label="Still butterfly ribbons">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sparkS" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fffef5"/>
              <stop offset="40%" stop-color="#ffe9a8"/>
              <stop offset="100%" stop-color="#ffd36a" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="gLS" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#0E7458"/><stop offset="100%" stop-color="#3FCCA0"/>
            </linearGradient>
            <linearGradient id="gRS" x1="1" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#5B3FC4"/><stop offset="100%" stop-color="#A48BF2"/>
            </linearGradient>
            <filter id="glS" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="1.4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- Butterfly wing lobes: upper + lower, left (mint) / right (violet) -->
          <g filter="url(#glS)" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <!-- L upper -->
            <path d="M100 118 C 78 108, 48 88, 38 58 C 32 42, 42 36, 55 42 C 68 48, 82 70, 100 118" stroke="url(#gLS)" stroke-width="2.2" opacity=".95"/>
            <path d="M100 118 C 74 104, 52 82, 44 55 C 40 44, 48 40, 58 45 C 70 52, 84 74, 100 118" stroke="url(#gLS)" stroke-width="1.5" opacity=".7"/>
            <path d="M100 118 C 70 100, 45 78, 36 50 C 30 38, 40 34, 52 40 C 66 48, 80 72, 100 118" stroke="url(#gLS)" stroke-width="1.15" opacity=".5"/>
            <!-- L lower -->
            <path d="M100 118 C 82 128, 58 142, 48 158 C 42 168, 52 172, 62 164 C 74 154, 88 132, 100 118" stroke="url(#gLS)" stroke-width="1.9" opacity=".85"/>
            <path d="M100 118 C 84 130, 64 146, 55 160 C 50 168, 58 170, 66 164 C 78 154, 90 134, 100 118" stroke="url(#gLS)" stroke-width="1.2" opacity=".55"/>
            <!-- R upper -->
            <path d="M100 118 C 122 108, 152 88, 162 58 C 168 42, 158 36, 145 42 C 132 48, 118 70, 100 118" stroke="url(#gRS)" stroke-width="2.2" opacity=".95"/>
            <path d="M100 118 C 126 104, 148 82, 156 55 C 160 44, 152 40, 142 45 C 130 52, 116 74, 100 118" stroke="url(#gRS)" stroke-width="1.5" opacity=".7"/>
            <path d="M100 118 C 130 100, 155 78, 164 50 C 170 38, 160 34, 148 40 C 134 48, 120 72, 100 118" stroke="url(#gRS)" stroke-width="1.15" opacity=".5"/>
            <!-- R lower -->
            <path d="M100 118 C 118 128, 142 142, 152 158 C 158 168, 148 172, 138 164 C 126 154, 112 132, 100 118" stroke="url(#gRS)" stroke-width="1.9" opacity=".85"/>
            <path d="M100 118 C 116 130, 136 146, 145 160 C 150 168, 142 170, 134 164 C 122 154, 110 134, 100 118" stroke="url(#gRS)" stroke-width="1.2" opacity=".55"/>
          </g>
          <circle cx="100" cy="118" r="10" fill="url(#sparkS)"/>
          <circle cx="100" cy="118" r="3" fill="#fff"/>
        </svg>
      </div>
      <p class="label">Still — butterfly ribbons</p>
    </div>
    <div class="col">
      <div class="stage" aria-label="Animated butterfly ribbons">
        <svg class="anim" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sparkA" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fffef5"/>
              <stop offset="40%" stop-color="#ffe9a8"/>
              <stop offset="100%" stop-color="#ffd36a" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="gLA" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#0E7458">
                <animate attributeName="stop-color" values="#0E7458;#1a9a72;#0E7458" dur="4s" repeatCount="indefinite"/>
              </stop>
              <stop offset="100%" stop-color="#3FCCA0">
                <animate attributeName="stop-color" values="#3FCCA0;#7dffd2;#3FCCA0" dur="3.5s" repeatCount="indefinite"/>
              </stop>
            </linearGradient>
            <linearGradient id="gRA" x1="1" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#5B3FC4">
                <animate attributeName="stop-color" values="#5B3FC4;#7a5cf0;#5B3FC4" dur="4.2s" repeatCount="indefinite"/>
              </stop>
              <stop offset="100%" stop-color="#A48BF2">
                <animate attributeName="stop-color" values="#A48BF2;#d2c2ff;#A48BF2" dur="3.2s" repeatCount="indefinite"/>
              </stop>
            </linearGradient>
            <filter id="glA" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="1.6" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <g filter="url(#glA)" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <!-- L upper lobe — gentle wing beat morph -->
            <path stroke="url(#gLA)" stroke-width="2.3" opacity=".95">
              <animate attributeName="d" dur="5s" repeatCount="indefinite"
                values="M100 118 C 78 108, 48 88, 38 58 C 32 42, 42 36, 55 42 C 68 48, 82 70, 100 118;
                        M100 118 C 76 104, 44 82, 32 52 C 26 36, 38 30, 52 38 C 66 46, 80 68, 100 118;
                        M100 118 C 80 110, 52 92, 42 62 C 36 46, 46 40, 58 46 C 70 52, 84 72, 100 118;
                        M100 118 C 78 108, 48 88, 38 58 C 32 42, 42 36, 55 42 C 68 48, 82 70, 100 118"/>
            </path>
            <path stroke="url(#gLA)" stroke-width="1.5" opacity=".7">
              <animate attributeName="d" dur="6s" repeatCount="indefinite"
                values="M100 118 C 74 104, 52 82, 44 55 C 40 44, 48 40, 58 45 C 70 52, 84 74, 100 118;
                        M100 118 C 72 100, 48 76, 38 48 C 34 38, 44 34, 56 42 C 68 50, 82 72, 100 118;
                        M100 118 C 76 106, 56 86, 48 58 C 44 48, 52 44, 60 48 C 72 54, 86 76, 100 118;
                        M100 118 C 74 104, 52 82, 44 55 C 40 44, 48 40, 58 45 C 70 52, 84 74, 100 118"/>
            </path>
            <path stroke="url(#gLA)" stroke-width="1.9" opacity=".85">
              <animate attributeName="d" dur="5.5s" repeatCount="indefinite"
                values="M100 118 C 82 128, 58 142, 48 158 C 42 168, 52 172, 62 164 C 74 154, 88 132, 100 118;
                        M100 118 C 80 130, 54 148, 42 166 C 36 176, 48 180, 60 170 C 74 158, 88 134, 100 118;
                        M100 118 C 84 126, 62 138, 52 152 C 46 162, 56 166, 64 160 C 76 150, 90 130, 100 118;
                        M100 118 C 82 128, 58 142, 48 158 C 42 168, 52 172, 62 164 C 74 154, 88 132, 100 118"/>
            </path>
            <!-- R upper -->
            <path stroke="url(#gRA)" stroke-width="2.3" opacity=".95">
              <animate attributeName="d" dur="5.2s" repeatCount="indefinite"
                values="M100 118 C 122 108, 152 88, 162 58 C 168 42, 158 36, 145 42 C 132 48, 118 70, 100 118;
                        M100 118 C 124 104, 156 82, 168 52 C 174 36, 162 30, 148 38 C 134 46, 120 68, 100 118;
                        M100 118 C 120 110, 148 92, 158 62 C 164 46, 154 40, 142 46 C 130 52, 116 72, 100 118;
                        M100 118 C 122 108, 152 88, 162 58 C 168 42, 158 36, 145 42 C 132 48, 118 70, 100 118"/>
            </path>
            <path stroke="url(#gRA)" stroke-width="1.5" opacity=".7">
              <animate attributeName="d" dur="6.2s" repeatCount="indefinite"
                values="M100 118 C 126 104, 148 82, 156 55 C 160 44, 152 40, 142 45 C 130 52, 116 74, 100 118;
                        M100 118 C 128 100, 152 76, 162 48 C 166 38, 156 34, 144 42 C 132 50, 118 72, 100 118;
                        M100 118 C 124 106, 144 86, 152 58 C 156 48, 148 44, 140 48 C 128 54, 114 76, 100 118;
                        M100 118 C 126 104, 148 82, 156 55 C 160 44, 152 40, 142 45 C 130 52, 116 74, 100 118"/>
            </path>
            <path stroke="url(#gRA)" stroke-width="1.9" opacity=".85">
              <animate attributeName="d" dur="5.7s" repeatCount="indefinite"
                values="M100 118 C 118 128, 142 142, 152 158 C 158 168, 148 172, 138 164 C 126 154, 112 132, 100 118;
                        M100 118 C 120 130, 146 148, 158 166 C 164 176, 152 180, 140 170 C 126 158, 112 134, 100 118;
                        M100 118 C 116 126, 138 138, 148 152 C 154 162, 144 166, 136 160 C 124 150, 110 130, 100 118;
                        M100 118 C 118 128, 142 142, 152 158 C 158 168, 148 172, 138 164 C 126 154, 112 132, 100 118"/>
            </path>
          </g>
          <circle cx="100" cy="118" r="11" fill="url(#sparkA)">
            <animate attributeName="r" values="9;12;9" dur="2.6s" repeatCount="indefinite"/>
          </circle>
          <circle cx="100" cy="118" r="3" fill="#fff"/>
        </svg>
      </div>
      <p class="label">Animated — wing beat / aurora</p>
    </div>
  </div>
  <p class="note">Same spark + mint/violet ribbons, shaped as butterfly upper/lower lobes. Only ribbons move.</p>
</body>
</html>
