<title>The Butterfly Effect Foundation</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,400;1,6..72,300&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --navy:#101B3A;
  --navy-deep:#0A1128;
  --ink-text:#E7ECF8;
  --ink-muted:#8E9CBE;
  --green:#3FCCA0;
  --gold:#E3C36A;
  --f-display:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--navy);
  color:var(--ink-text);
  font-family:var(--f-display);
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  overflow-x:hidden;
}

/* a soft pool of light behind the composition */
.page{
  position:relative;
  width:100%;
  max-width:560px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:clamp(22px,4vw,34px);
}
.page::before{
  content:"";
  position:absolute;
  left:50%;top:38%;
  width:min(120vw,760px);aspect-ratio:1;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(63,204,160,.10) 0%, rgba(63,204,160,.03) 42%, transparent 68%);
  pointer-events:none;
}

.wordmark{
  position:relative;
  font-size:clamp(17px,3.2vw,20px);
  letter-spacing:-.02em;
  color:var(--ink-text);
}
.wordmark em{font-style:italic;color:var(--green)}
.wordmark span{
  display:block;
  margin-top:8px;
  font-family:var(--f-mono);
  font-size:10px;
  font-weight:500;
  letter-spacing:.26em;
  text-transform:uppercase;
  color:var(--ink-muted);
}

.art{position:relative;width:min(100%,340px)}
.art svg{display:block;width:100%;height:auto;overflow:visible}

/* the chrysalis hangs, so it swings from where it grips the branch */
.hang{
  transform-box:view-box;
  transform-origin:200px 64px;
  animation:sway 7.5s ease-in-out infinite;
}
@keyframes sway{
  0%,100%{transform:rotate(-1.6deg)}
  50%{transform:rotate(1.6deg)}
}

.headline{
  position:relative;
  font-size:clamp(38px,9vw,60px);
  font-weight:300;
  line-height:1.05;
  letter-spacing:-.02em;
  color:var(--ink-text);
  text-wrap:balance;
}

.rule{
  position:relative;
  width:54px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(227,195,106,.6),transparent);
}

@media (prefers-reduced-motion:reduce){
  .hang{animation:none;transform:rotate(0deg)}
}
</style>

<div class="page">

  <p class="wordmark">
    The Butterfly <em>Effect</em>
    <span>Foundation</span>
  </p>

  <div class="art">
    <svg viewBox="0 0 400 330" role="img" aria-label="A butterfly chrysalis hanging from a leafy branch">

      <defs>
        <linearGradient id="bark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6B5C46"/>
          <stop offset="1" stop-color="#3B3225"/>
        </linearGradient>

        <linearGradient id="shell" x1="0.15" y1="0" x2="0.9" y2="1">
          <stop offset="0" stop-color="#5FD8B0"/>
          <stop offset="0.42" stop-color="#31AE87"/>
          <stop offset="1" stop-color="#17694F"/>
        </linearGradient>

        <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3E9E7A"/>
          <stop offset="1" stop-color="#1F5F49"/>
        </linearGradient>

        <!-- the wings showing faintly through the casing -->
        <clipPath id="inside">
          <path d="M200 92 C214 100 222 116 228 140 C236 172 240 202 236 228
                   C232 258 220 276 200 281 C180 276 168 258 164 228
                   C160 202 164 172 172 140 C178 116 186 100 200 92 Z"/>
        </clipPath>
      </defs>

      <!-- branch -->
      <path d="M4 54 C70 42 140 52 200 62 C262 72 330 66 396 50"
            fill="none" stroke="url(#bark)" stroke-width="12" stroke-linecap="round"/>
      <path d="M40 52 C90 45 130 50 168 56" fill="none"
            stroke="rgba(24,20,14,.35)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M240 70 C290 74 340 68 384 56" fill="none"
            stroke="rgba(24,20,14,.30)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- twigs -->
      <path d="M96 50 C88 34 78 26 64 20" fill="none" stroke="url(#bark)"
            stroke-width="4" stroke-linecap="round"/>
      <path d="M300 68 C312 54 326 46 342 42" fill="none" stroke="url(#bark)"
            stroke-width="4" stroke-linecap="round"/>

      <!-- leaves -->
      <g>
        <g transform="translate(64,20) rotate(-32)">
          <path d="M0 0 C16 -14 42 -12 54 4 C42 20 16 20 0 0 Z" fill="url(#leafA)"/>
          <path d="M2 1 C18 2 38 4 52 4" fill="none" stroke="rgba(10,30,24,.45)" stroke-width="1.4"/>
        </g>
        <g transform="translate(342,42) rotate(-14)">
          <path d="M0 0 C14 -13 38 -11 49 4 C38 19 14 19 0 0 Z" fill="url(#leafA)"/>
          <path d="M2 1 C17 2 34 3 47 4" fill="none" stroke="rgba(10,30,24,.45)" stroke-width="1.4"/>
        </g>
        <g transform="translate(286,72) rotate(24)">
          <path d="M0 0 C12 -11 32 -9 42 3 C32 16 12 16 0 0 Z" fill="url(#leafA)" opacity=".82"/>
          <path d="M2 1 C15 2 30 3 40 3" fill="none" stroke="rgba(10,30,24,.4)" stroke-width="1.2"/>
        </g>
      </g>

      <!-- everything below hangs and sways together -->
      <g class="hang">

        <!-- silk pad and cremaster: how it actually grips -->
        <ellipse cx="200" cy="66" rx="7" ry="3.4" fill="#2A2418"/>
        <path d="M200 68 C201 74 199 80 200 90" fill="none"
              stroke="#C9D6E8" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>

        <!-- shell -->
        <path d="M200 92 C214 100 222 116 228 140 C236 172 240 202 236 228
                 C232 258 220 276 200 281 C180 276 168 258 164 228
                 C160 202 164 172 172 140 C178 116 186 100 200 92 Z"
              fill="url(#shell)"/>

        <!-- wings visible through the casing, close to emerging -->
        <g clip-path="url(#inside)" opacity=".40">
          <path d="M198 196 C178 206 168 228 172 252 C180 268 192 274 198 274 Z" fill="#6B4FD8"/>
          <path d="M202 196 C222 206 232 228 228 252 C220 268 208 274 202 274 Z" fill="#3D6FE0"/>
          <path d="M199 214 C186 224 180 242 183 258" fill="none"
                stroke="rgba(12,16,40,.5)" stroke-width="1.6"/>
          <path d="M201 214 C214 224 220 242 217 258" fill="none"
                stroke="rgba(12,16,40,.5)" stroke-width="1.6"/>
        </g>

        <!-- highlight down the lit edge -->
        <path d="M182 118 C173 146 170 186 173 220"
              fill="none" stroke="rgba(232,255,246,.42)" stroke-width="5"
              stroke-linecap="round" opacity=".5"/>

        <!-- the gold band a monarch chrysalis actually wears -->
        <g fill="var(--gold)">
          <circle cx="170" cy="196" r="2.5"/>
          <circle cx="179" cy="202" r="2.8"/>
          <circle cx="189" cy="205" r="2.9"/>
          <circle cx="200" cy="206" r="3"/>
          <circle cx="211" cy="205" r="2.9"/>
          <circle cx="221" cy="202" r="2.8"/>
          <circle cx="230" cy="196" r="2.5"/>
          <!-- scattered flecks nearer the crown -->
          <circle cx="192" cy="128" r="2.1"/>
          <circle cx="207" cy="132" r="1.9"/>
          <circle cx="199" cy="119" r="1.7"/>
          <circle cx="216" cy="146" r="1.6" opacity=".8"/>
          <circle cx="184" cy="150" r="1.6" opacity=".8"/>
        </g>

        <!-- rim so the shell reads against the ground -->
        <path d="M200 92 C214 100 222 116 228 140 C236 172 240 202 236 228
                 C232 258 220 276 200 281 C180 276 168 258 164 228
                 C160 202 164 172 172 140 C178 116 186 100 200 92 Z"
              fill="none" stroke="rgba(10,44,34,.55)" stroke-width="1.6"/>
      </g>
    </svg>
  </div>

  <div class="rule"></div>

  <h1 class="headline">Coming Soon</h1>

</div>
