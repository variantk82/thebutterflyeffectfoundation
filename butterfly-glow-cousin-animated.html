<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TBEF Cousin Butterfly — body locked, wings + glow</title>
<style>
  :root { --bg:#05070f; }
  * { box-sizing: border-box; }
  html, body { margin:0; }
  body.preview {
    min-height:100vh; display:grid; place-items:center; gap:1rem;
    background: radial-gradient(ellipse 70% 55% at 50% 45%, #121a33 0%, var(--bg) 72%);
    font-family:system-ui,sans-serif; color:#e8ecf8;
  }
  .logo {
    width:min(640px,94vw); aspect-ratio:16/9; position:relative;
    border-radius:16px; overflow:hidden; background:#000;
  }
  .mark {
    position:absolute; inset:0;
    background: url('butterfly-glow-cousin.png') center / contain no-repeat;
  }
  .underlay { z-index:0; }
  .wing {
    z-index:1;
    will-change: transform, filter;
  }
  .wing-left {
    clip-path: polygon(0% 0%, 48.4% 0%, 48.4% 100%, 0% 100%);
    transform-origin: 48.4% 48%;
    animation: flapL 2.8s ease-in-out infinite, glowPulse 5.5s ease-in-out infinite;
  }
  .wing-right {
    clip-path: polygon(51.6% 0%, 100% 0%, 100% 100%, 51.6% 100%);
    transform-origin: 51.6% 48%;
    animation: flapR 2.8s ease-in-out infinite, glowPulse 5.5s ease-in-out infinite;
  }
  .body {
    z-index:3;
    clip-path: polygon(
      48.35% 6%, 51.65% 6%,
      51.9% 14%, 51.7% 22%,
      51.5% 72%, 48.5% 72%,
      48.3% 22%, 48.1% 14%
    );
  }
  .body-strip {
    z-index:4;
    clip-path: inset(8% 48.15% 26% 48.15%);
  }
  @keyframes flapL {
    0%,100% { transform: perspective(1200px) rotateY(0deg) rotateZ(0deg); }
    50% { transform: perspective(1200px) rotateY(11deg) rotateZ(-1.2deg); }
  }
  @keyframes flapR {
    0%,100% { transform: perspective(1200px) rotateY(0deg) rotateZ(0deg); }
    50% { transform: perspective(1200px) rotateY(-11deg) rotateZ(1.2deg); }
  }
  @keyframes glowPulse {
    0%,100% { filter: brightness(0.96) saturate(1.04); }
    50% { filter: brightness(1.10) saturate(1.12); }
  }
    50% { filter: brightness(1.10) saturate(1.12); }
  }
.note { font-size:.8rem; opacity:.55; text-align:center; max-width:36rem; margin:0; }
  @media (prefers-reduced-motion: reduce) {
    .wing-left, .wing-right { animation: none !important; }
  }
</style>
</head>
<body class="preview">
  <div class="logo" role="img" aria-label="The Butterfly Effect Foundation logo">
    <div class="mark underlay" aria-hidden="true"></div>
    <div class="mark wing wing-left" aria-hidden="true">
</div>
    <div class="mark wing wing-right" aria-hidden="true">
</div>
    <div class="mark body" aria-hidden="true"></div>
    <div class="mark body-strip" aria-hidden="true"></div>
  </div>
  <p class="note">Body locked. Wings flap. Colors gently brighten and dim.</p>
</body>
</html>
